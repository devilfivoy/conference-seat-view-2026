<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 年会音乐厅座位表</title>
<style>
  *{box-sizing:border-box}
  :root{font:16px/1.55 system-ui,-apple-system,sans-serif;color:#1b2832;background:#f1f4f6}
  body{margin:0}
  header{background:#f9fbfc;border-bottom:1px solid #d4dfe6;padding:14px 24px}
  h1{font-size:1.55rem;margin:0 0 5px}
  h2{font-size:1.12rem;margin:0 0 10px}
  p{margin:0 0 10px}
  button,input{font:inherit}
  button{cursor:pointer;border:1px solid #9bafbc;background:#fff;color:#203342;border-radius:5px;padding:6px 10px}
  button:disabled{opacity:.55;cursor:default}
  button:focus-visible,input:focus-visible{outline:3px solid #005ca3;outline-offset:2px}
  .primary{color:white;background:#17374b;border-color:#17374b}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
  .toolbar input{width:min(250px,100%);border:1px solid #9bafbc;border-radius:5px;padding:6px 10px}
  .toolbar a{color:#17374b;text-underline-offset:3px}
  #status,#message{font-size:.9rem;color:#3c5363}
  #status[data-error="true"]{color:#9d2b21}
  #message{min-height:1.5em;margin-top:6px}
  main{display:grid;grid-template-columns:minmax(0,1fr) minmax(305px,395px);gap:14px;padding:14px}
  .chart,.detail{background:white;border:1px solid #d4dfe6;border-radius:8px;padding:12px}
  .chart{overflow:auto}
  .detail{align-self:start;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
  .detail-heading{display:flex;gap:8px;justify-content:space-between;align-items:baseline}
  .detail-heading button{font-size:.83rem;flex:none;padding:4px 7px}
  .seat-location{font-size:.91rem;color:#435a6b}
  .person-section{margin:14px 0 0;padding-top:10px;border-top:1px solid #d4dfe6;font-size:.93rem}
  .person-section h3,.person-section summary{font-size:.98rem;margin:0 0 6px;font-weight:700}
  .person-section summary{cursor:pointer}
  .person-section h4{font-size:.95rem;margin:0 0 5px}
  .detail-list{margin:5px 0 0;padding-left:1.25em;overflow-wrap:anywhere}
  .detail-list li{margin:0 0 6px}
  .detail-list small{display:block;color:#435a6b;font-size:.85rem}
  .paper-record+.paper-record{margin-top:10px;padding-top:8px;border-top:1px dotted #a8bac6}
  #seatActions:empty{display:none}
  #map{display:grid;grid-template-columns:54px repeat(33,minmax(62px,1fr));grid-auto-rows:minmax(31px,auto);gap:2px;min-width:2170px}
  .stage,.aisle,.zones,.row-label{display:grid;place-items:center;text-align:center}
  .stage{grid-column:2/-1;background:#e0e9ee;border-radius:5px;font-weight:700;min-height:46px}
  .aisle{grid-column:2/-1;background:#f1f5f7;color:#435a6b;min-height:27px}
  .row-label,.zones{color:#435a6b;font-size:.8rem;font-weight:650}
  .row-label.mix{color:#87392b;background:#f9e2db}
  .seat{min-width:0;border-radius:3px;padding:2px 1px;font-size:.88rem;line-height:1.2;overflow-wrap:anywhere}
  .yellow{background:#ffeba3;border-color:#b09858}
  .blue{background:#d9e7f2;border-color:#91abc2}
  .white{background:#f7f9fa;border-color:#dbe2e6}
  .teacher{background:#ffd778;font-weight:700}
  .volunteer{background:#fff4c8}
  .fixed{border-bottom:3px solid #526c7c}
  .seat[aria-pressed="true"]{background:#ceecff;outline:2px solid #005ca3;z-index:1}
  .seat.target{outline:1px dashed #3a5264}
  .seat.dim{opacity:.3}
  .tag{font-size:.74rem;color:#5c4d2f;margin-left:2px}
  dl{margin:0}
  dt{font-weight:700;margin-top:12px}
  dd{margin:2px 0 0;overflow-wrap:anywhere}
  .note{color:#7d3428;background:#f9eee7;padding:8px;border-radius:4px}
  .legend{font-size:.85rem;color:#435a6b;margin:0 0 8px}
  @media(max-width:800px){
    header{padding:12px}
    main{display:flex;flex-direction:column;padding:8px}
    .detail{position:static;order:-1;max-height:44vh;width:100%}
    #map{grid-template-columns:46px repeat(33,62px)}
  }
</style>
<header>
  <h1>2026 年会音乐厅座位表</h1>
  <p>参会者座位表 · 可搜索姓名并查看所在排和座号。</p><p id="summary">最终签到名单</p>
  <div class="toolbar">
    <input id="search" type="search" placeholder="搜索姓名或机构" aria-label="搜索姓名或机构">
    <button id="find">定位</button>
    <button id="retry" hidden>重试保存</button>
    <button id="reload" hidden>载入云端版本</button>
    <span id="status" role="status">正在读取座位…</span>
  </div>
  <div id="message" role="status"></div>
</header>
<main>
  <section class="chart" aria-label="音乐厅座位图">
    <p class="legend" id="legend">悬浮或点击座位查看姓名和座号。</p>
    <div id="map"></div>
  </section>
  <aside class="detail" id="details" aria-label="座位详情">
    <h2>座位详情</h2><p id="seatHelp">点击姓名查看所在排和座号。</p>
  </aside>
</main>

<script>
(async function start() {
  const $ = id => document.getElementById(id);
  const message = text => { $('message').textContent = text; };
  const escape = text => String(text ?? '').replace(/[&<>"']/g, ch =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
  const request = async (path, options) => {
    const response = await fetch(path, {cache: 'no-store', ...options});
    if (!(response.headers.get('content-type') || '').includes('application/json')) {
      throw new Error('请使用有访问权限的 ChatGPT 账号打开网页。');
    }
    const result = await response.json();
    if (!response.ok) throw Object.assign(new Error(result.error), {status: response.status});
    return result;
  };
  const preview = null;
  const offline = JSON.parse($('seatOfflineData').textContent);
  const data = {layout:offline.layout};
  const snapshot = {state:{assignments:offline.assignments},revision:0,canEdit:false};
  const canEdit = Boolean(preview || (snapshot.canEdit && data.people));
  let state, selected = '', hovered = '', moving = '', detailAddress = '';
  const seats = new Map(data.layout.map(seat => [seat.address, seat]));
  const people = data.people || {};
  const sync = preview || !canEdit ? null : new SharedSeatSync({
    request: (method, payload) => request('/api/state', {
      method, headers: {'content-type':'application/json'}, body: payload ? JSON.stringify(payload) : undefined
    }),
    onRemote: remote => { state = remote; moving = ''; render(); },
    onStatus: status => {
      const target = $('status');
      target.textContent = status;
      target.dataset.error = String(status.startsWith('未保存') || status.startsWith('有人先'));
      $('retry').hidden = !status.startsWith('未保存');
      $('reload').hidden = !status.startsWith('有人先');
    }
  });
  if (canEdit) {
    $('legend').textContent = '鼠标移到姓名上，右侧显示资料和排位依据。点击固定详情，拖动可换座。';
    $('seatHelp').textContent = '悬浮查看资料。点击固定详情，可以换座或锁位。';
  }
  if (preview) {
    const initial = {assignments:{...data.assignments}, locks:{...data.locks}};
    try {
      state = JSON.parse(localStorage.getItem('final-conference-seat-preview-v1')) || initial;
    } catch { state = initial; }
    $('status').textContent = '本机版';
  } else if (canEdit) {
    state = snapshot.state;
    sync.revision = snapshot.revision;
    $('status').textContent = sync.revision ? '已同步云端 · 版本 ' + sync.revision : '已载入最终签到排位';
    $('retry').onclick = () => sync.retry();
    $('reload').onclick = () => {
      if (confirm('载入云端座位会舍弃本页未保存的调整。确定载入吗？')) {
        sync.reload().catch(error => message(error.message));
      }
    };
    setInterval(() => sync.poll(), 3500);
    window.addEventListener('beforeunload', event => {
      if (sync.dirty) { event.preventDefault(); event.returnValue = ''; }
    });
  } else {
    state = {...snapshot.state, locks:{}};
    $('status').textContent = '座位查询';
    $('search').placeholder = '搜索姓名';
    $('search').setAttribute('aria-label', '搜索姓名');

  }

  function save(note) {
    if (!preview) return void sync.save(state, note);
    try {
      localStorage.setItem('final-conference-seat-preview-v1', JSON.stringify(state));
      $('status').textContent = '已保存在本浏览器';
    } catch {
      $('status').textContent = '浏览器无法保存，座位调整仅在本页有效';
    }
  }
  const eligible = address => seats.get(address)?.color === 'yellow' && !seats.get(address).reserved;
  function move(from, to) {
    if (!canEdit) return;
    if (from === to) { moving = ''; render(); return; }
    if (!state.assignments[from] || !eligible(from) || !eligible(to) || state.locks[from] || state.locks[to]) {
      message('请选择可调整的黄色座位。带锁位置需要先解锁。');
      return;
    }
    const occupant = state.assignments[from];
    const previous = state.assignments[to];
    state.assignments[to] = occupant;
    if (previous) state.assignments[from] = previous;
    else delete state.assignments[from];
    moving = ''; selected = to; hovered = '';
    message(previous ? `${occupant} 与 ${previous} 已换座。` : `${occupant} 已换到 ${to}。`);

  }

  function location(seat) {
    return seat ? `Excel 第 ${seat.row} 行 · ${seat.region} ${seat.number} 号 · ${seat.address}` : '当前无座位';
  }

    return item ? [item.file, item.sheet, item.cells].filter(Boolean).map(escape).join(' · ') : '';
  }

      if (!names?.length) return '';

      });

    };

    let details = section('座位说明', `<p>${escape(empty)}</p>`);
    if (person) {
      const original = seats.get(person.initial);
      const adjusted = person.initial !== address;
      const roleRules = {
        teacher: '新增教师集中坐第 18–20 行的中区黄色席。先排有较多已签到共同作者的老师，其次参考签到表顺序。',
        paper: '论文参会者先安排，尽量选第 22 行及之前的中区。外校参会者也可优先坐前方两侧靠过道的 1–3 号。纯学生作者团队尽量同排相邻。',
        volunteer: '已招募且在论文排稿中无同名记录的志愿者最后安排，优先后排两侧靠边座位。',
        attendee: '教师、有论文的参会者排好之后，再从前向后补入剩余黄色席。',
      };
      const logic = person.preserved
        ? '原图已经填好的位置优先沿用，补排时以这些座位为固定条件。'
        : roleRules[person.kind];
      const notes = (adjusted ? '<p class="note">当前位置来自手动调整。下列依据对应最初的排位。</p>' : '') +
        `<p>${escape(person.reason)}</p>` + (logic ? `<p>${escape(logic)}</p>` : '');
      const identity = '<dl>' + entry('排位身份', person.role) + entry('签到机构', person.org || '资料未填') +
        entry('机构分组', person.seatInstitution) + entry('最终签到表记录', person.registered ? '名单有同名记录' : '名单无同名记录') +
        entry('签到表序号', person.signInNumber) + entry('来源中的候选身份', person.identityCandidate) +
        entry('身份核对说明', person.identityEvidence) + entry('志愿者编号', person.volunteer?.number) +
        entry('招募状态', person.volunteer?.status) + entry('原始座位', location(original)) +
        entry('当前锁位', state.locks[address] ? '已锁定' : '可调整') + '</dl>';
      const publications = person.publications?.length
        ? person.publications.map(paper => `<article class="paper-record"><h4>${escape(paper.title)}</h4><dl>` +
          entry('分论坛', [paper.forum, paper.theme].filter(Boolean).join(' · ')) + entry('分论坛内顺序', paper.order) +
          entry('作者顺序', paper.authors.join('、')) + entry('作者单位（原表）', paper.units) +
          entry('来源', [paper.source.file, paper.source.sheet, paper.source.cells].join(' · ')) + '</dl></article>').join('')
        : '<p>论文排稿里未匹配到这个姓名。</p>';
      const references = person.referenceRows?.map(item => `<li>${reference(item)}</li>`).join('') || '';
      const byTeacher = other => {
        const offset = Math.abs(seat.column - other.column);
        const placement = seat.row > other.row ? '当前坐在老师后方' : seat.row === other.row ? '当前与老师同排' : '当前坐在老师前方';
        return [placement, sameSide(seat, other) ? (offset === 0 ? '同列' : offset === 1 ? '邻列' : '同区') : '不同区'].join(' · ');
      };
      details = section('为什么安排在这里', notes) + section('身份与签到', identity) +
        describePlacement('同组论文作者', person.team, other =>
          seat.row !== other.row ? '当前分在不同排' : sameSide(seat, other) && Math.abs(seat.column - other.column) === 1
            ? '当前同排相邻' : '当前同排') +
        describePlacement('共同署名老师（用于排位参考）', person.related, byTeacher) +
        describePlacement('共同署名的参会者', person.linkedAttendees) +
        section('论文与分论坛', publications) +
        section('资料对应表格', references ? `<ul class="detail-list">${references}</ul>` : '');
    }

      '<li>保留原图已有姓名与座位，只使用黄色可排席。</li>' +
      '<li>新增教师从 Excel 第 18 行起集中排在中区，学生尽量与教师分排。因座位容量出现同排时，在座位图标出。</li>' +
      '<li>有论文的参会学生优先中区并尽量安排在第 22 行及之前。外校同学也可优先使用前方两侧靠过道的 1–3 号。</li>' +
      '<li>纯学生共同作者尽量同排相邻。师生共同署名用于安排学生在老师后方同区、同列或邻列。共同署名只用于排位。</li>' +
      '<li>普通参会者按剩余黄色席从前向后补排。无论文志愿者最后安排，优先两侧靠边的后排。第 23、24 行仅在容量所需时使用。</li>' +
      '</ol></details>';
    panel.innerHTML = heading + `<p class="seat-location">${escape(location(seat))}</p><div id="seatActions" class="toolbar"></div>` +
      facts + details + policy;
    if (newSeat) panel.scrollTop = 0;
    bindUnpin();
    if (!selected || !eligible(selected)) return;
    const choices = $('seatActions');
    const lock = document.createElement('button');
    lock.textContent = state.locks[selected] ? '解锁座位' : '锁定座位';
    lock.onclick = () => {
      state.locks[selected] = !state.locks[selected];
      moving = '';
      save(state.locks[selected] ? '锁定座位' : '解锁座位');
      render();
    };
    choices.append(lock);
    if ((name && !state.locks[selected]) || moving) {
      const button = document.createElement('button');
      button.className = 'primary';
      button.textContent = moving ? '取消换座' : '选择目标座位';
      button.onclick = () => {
        moving = moving ? '' : selected;
        message(moving ? '请点击要交换或移入的黄色座位。' : '');
        render();
      };
      choices.prepend(button);
    }
  }

  function bindUnpin() {
    const unpin = $('unpinSeat');
    if (!unpin) return;
    unpin.onclick = () => {
      hovered = selected; selected = ''; moving = ''; message(''); render();
    };
  }

  function render(restoreAddress) {
    const map = $('map');
    map.replaceChildren();
    const mix = new Map();
    const positions = new Map();
    for (const [address, name] of Object.entries(state.assignments)) {
      const seat = seats.get(address), person = people[name];
      if (seat) positions.set(name, seat);
      if (!seat || !person || !person.registered || person.kind === 'fixed') continue;
      mix.set(seat.row, (mix.get(seat.row) || 0) | (person.kind === 'teacher' ? 1 : 2));
    }
    const mixed = new Set([...mix].filter(([, kinds]) => kinds === 3).map(([row]) => row));
    const block = (text, css, row, col) => {
      const box = document.createElement('div');
      box.className = css; box.textContent = text; box.style.gridRow = row;
      if (col) box.style.gridColumn = col;
      map.append(box);
    };
    block('演讲台', 'stage', 1);
    block('左区', 'zones', 2, '2/11');
    block('中区', 'zones', 2, '12/25');
    block('右区', 'zones', 2, '26/35');
    block('过道', 'aisle', 7);
    block('嘉宾席', 'aisle', 8);
    const displayedRow = row => row < 12 ? row - 5 : row - 6;
    const query = $('search').value.trim().toLowerCase();
    for (const row of new Set(data.layout.map(seat => seat.row))) {
      block(mixed.has(row) ? `${row} · 混排` : String(row), 'row-label' + (mixed.has(row) ? ' mix' : ''), displayedRow(row), 1);
    }
    for (const seat of data.layout) {
      const button = document.createElement('button');
      const address = seat.address, name = state.assignments[address], person = people[name];
      button.type = 'button';
      button.dataset.seat = address;
      button.className = 'seat ' + seat.color + (person ? ' ' + person.kind : '') + (state.locks[address] ? ' fixed' : '');
      button.classList.toggle('target', !!moving && eligible(address) && !state.locks[address] && address !== moving);
      button.classList.toggle('dim', !!query && !`${name || ''} ${person?.org || ''}`.toLowerCase().includes(query));
      button.style.gridRow = displayedRow(seat.row); button.style.gridColumn = seat.column;
      button.textContent = (name || (seat.reserved ? '预留' : seat.number)) + (state.locks[address] ? ' 🔒' : '');
      button.setAttribute('aria-pressed', String(address === selected));
      button.setAttribute('aria-label', `${address}，${name || '空座'}，${seat.region} ${seat.number} 号`);
      button.setAttribute('aria-controls', 'details');
      const previewSeat = () => {
        if (!selected && !moving && hovered !== address) {
          hovered = address;
          renderDetails(mixed, positions);
        }
      };
      button.addEventListener('pointerenter', event => {
        if (event.pointerType !== 'touch') previewSeat();
      });
      button.addEventListener('focus', previewSeat);
      button.onclick = () => {
        if (moving) return move(moving, address);
        selected = address; hovered = ''; message(''); render(address);
      };
      if (canEdit) {
        button.draggable = !!name && eligible(address) && !state.locks[address];
        button.addEventListener('dragstart', event => event.dataTransfer.setData('application/x-seat', address));
        button.addEventListener('dragover', event => {
          if (eligible(address) && !state.locks[address] && event.dataTransfer.types.includes('application/x-seat')) event.preventDefault();
        });
        button.addEventListener('drop', event => {
          event.preventDefault(); move(event.dataTransfer.getData('application/x-seat'), address);
        });
      }
      map.append(button);
    }
    $('summary').textContent = canEdit
      ? `签到名单 ${data.total} 人 · 已排 ${Object.values(state.assignments).filter(n => people[n]?.registered).length} 人 · 第 23、24 行为后排补位`
      : `已安排 ${Object.keys(state.assignments).length} 席 · 可按姓名查询`;
    renderDetails(mixed, positions);
    if (restoreAddress) map.querySelector(`[data-seat="${restoreAddress}"]`)?.focus({preventScroll:true});
  }
  $('search').oninput = () => render();
  $('find').onclick = () => {
    const query = $('search').value.trim().toLowerCase();
    if (!query) return;
    const entry = Object.entries(state.assignments).find(([, name]) => name.toLowerCase() === query)
      || Object.entries(state.assignments).find(([, name]) => `${name} ${people[name]?.org || ''}`.toLowerCase().includes(query));
    if (!entry) return message('没有找到匹配的人。');
    moving = ''; selected = entry[0]; hovered = ''; message(''); render(selected);
    $('map').querySelector(`[data-seat="${selected}"]`)?.scrollIntoView({block:'nearest', inline:'center'});
  };
  $('search').addEventListener('keydown', event => { if (event.key === 'Enter') $('find').click(); });
  render();
  $('map').querySelector('[data-seat="R18"]')?.scrollIntoView({block:'nearest',inline:'center'});
})().catch(error => {
  document.getElementById('status').textContent = '暂时无法打开座位图';
  document.getElementById('message').textContent = error.message;
});

</script>
</html>
